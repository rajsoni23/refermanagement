<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Shree RBSK</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>Shree RBSK</h1><p>Referral Management System</p></div></div><div class="top-actions"><span id="userMobile" class="user-pill">Demo User</span><button id="logout" class="btn light small">Logout</button></div></header><section class="hero"><div><h2>Referral Dashboard</h2><p>Manage referred children and treatment follow-up.</p></div><button id="newReferral" class="btn white">＋ New Referral</button></section><section class="stats"><div class="stat">📋<b id="total">0</b><small>Total Referrals</small></div><div class="stat">⏳<b id="pending">0</b><small>Pending</small></div><div class="stat">📤<b id="referred">0</b><small>Referred</small></div><div class="stat">🏥<b id="started">0</b><small>Treatment Started</small></div><div class="stat">✓<b id="completed">0</b><small>Completed</small></div></section><section class="panel"><div class="section-head"><h3>Referral Records</h3><div class="filters"><input id="search" placeholder="Search child or institute..."><select id="statusFilter"><option value="">All Status</option><option>Pending</option><option>Referred</option><option>Treatment Started</option><option>Completed</option></select><select id="typeFilter"><option value="">All Institutes</option><option>School</option><option>AWC</option></select></div></div><div id="records" class="records"></div></section></div><div id="referralModal" class="modal"><div class="modal-card large"><div class="modal-head"><h3>New Referral</h3><button class="close" data-close="referralModal">×</button></div><form id="referralForm"><div class="form-grid"><label>Child Name *<input id="childName" required></label><label>Sex *<select id="sex" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>DOB *<input id="dob" type="date" required></label><label>Birth Certificate Number<input id="birthCertificateNo"></label><label>Father Name<input id="fatherName"></label><label>Mother Name<input id="motherName"></label><label>Weight (kg)<input id="weight" type="number" step="0.1"></label><label>Height (cm)<input id="height" type="number" step="0.1"></label><label class="full">Defect / Health Problem *<textarea id="defect" rows="3" required placeholder="Enter identified defect / health problem"></textarea></label><label>Institute Type *<select id="instituteType" required><option value="">Select</option><option>School</option><option>AWC</option></select></label><label>Institute Name *<input id="instituteName" required></label><label id="classWrap" hidden>Class<select id="className"><option value="">Select Class</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label id="awcWrap" hidden>AWC Worker Number<input id="awcWorkerNumber"></label><label>Mobile 1<input id="mobile1" maxlength="10" inputmode="numeric"></label><label>Mobile 2<input id="mobile2" maxlength="10" inputmode="numeric"></label><label class="full">Mobile 3<input id="mobile3" maxlength="10" inputmode="numeric"></label></div><div class="modal-actions"><button type="button" class="btn light" data-close="referralModal">Cancel</button><button class="btn primary">Save Referral</button></div></form></div></div><div id="statusModal" class="modal"><div class="modal-card"><div class="modal-head"><h3>Update Status</h3><button class="close" data-close="statusModal">×</button></div><form id="statusForm"><label>Status<select id="newStatus"><option>Pending</option><option>Referred</option><option>Treatment Started</option><option>Completed</option></select></label><div id="treatmentFields" class="treatment-fields"><label>Hospital Name *<input id="hospitalName"></label><label>Estimated Treatment Expenditure (₹) *<input id="estimatedExpenditure" type="number" min="0" step="1" placeholder="e.g. 15000"></label></div><div class="modal-actions"><button type="button" class="btn light" data-close="statusModal">Cancel</button><button class="btn primary">Update</button></div></form></div></div><script type="module" src="js/dashboard.js"></script></body></html>
